# ccpace plan — copy to ~/.config/ccpace/config.toml and edit.
# Everything here is optional. With no config, every day gets an equal share
# of the week, spread flat from 9am to midnight.

# The zone the hours below are written in, and the one every time is shown in.
# Default: the machine's own. Set it if ccpace also runs somewhere on another
# clock (a server on UTC, say), so the plan means the same thing there.
# timezone = "America/Los_Angeles"

# ± points of the weekly meter that still count as "on plan"
tolerance = 2

# The hour a "day" rolls over (default 0, midnight). With 2, Tuesday runs
# Tue 2am -> Wed 2am, so a late night counts toward the evening it began in,
# and a block may run past midnight: [18, 2, 0.8].
# day_starts = 2

# Share of the week each day gets. Only the ratios matter.
# Keys: mon tue wed thu fri sat sun, or the groups weekday / weekend / all.
# A named day beats a group, a group beats `all`. 0 means a day off.
[days]
weekday = 12
weekend = 20
# fri = 6

# How a day's share is spread over the clock, as [from_hour, to_hour, fraction]
# blocks (24h, decimals ok: 17.5 = 5:30pm). Hours outside every block expect
# no usage. The last block of the day is the "prime" block the advice is
# phrased around ("take it easy until 6pm", "go 1.5x tonight").
[hours]
weekday = [[9, 18, 0.2], [18, 24, 0.8]]   # trickle during work, most of it in the evening
weekend = [[9, 24, 1.0]]                  # flat across the day
